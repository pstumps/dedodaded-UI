services:
  panel:
    build:
      context: .
    image: dedodaded-panel:local
    container_name: dedodaded-panel
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "${DOCKER_GID:?Docker socket group ID is required}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "${PANEL_BIND_ADDRESS:-127.0.0.1}:${PANEL_HTTP_PORT:-8080}:8080"
    environment:
      PANEL_BIND_HOST: 0.0.0.0
      PANEL_PORT: 8080
      PANEL_DATA_ROOT: /data
      PANEL_HOST_DATA_ROOT: "${PANEL_DATA_DIR:-/var/lib/dedodaded}"
      PANEL_ENCRYPTION_KEY: "${PANEL_ENCRYPTION_KEY:?Panel encryption key is required}"
      PANEL_BOOTSTRAP_USERNAME: "${PANEL_BOOTSTRAP_USERNAME:-admin}"
      PANEL_BOOTSTRAP_PASSWORD_FILE: /run/panel-secrets/bootstrap_admin_password
      PANEL_COOKIE_SECURE: "${PANEL_COOKIE_SECURE:-false}"
      PANEL_ALLOWED_ORIGIN: "${PANEL_ALLOWED_ORIGIN:-}"
      PANEL_FORWARDED_ALLOW_IPS: "${PANEL_FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - "${PANEL_DATA_DIR:-/var/lib/dedodaded}:/data:rw"
      - "${PANEL_SECRETS_DIR:-/var/lib/dedodaded/secrets}:/run/panel-secrets:rw"
      - /var/run/docker.sock:/var/run/docker.sock:rw
