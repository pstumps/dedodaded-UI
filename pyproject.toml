[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dedodaded"
version = "0.1.0"
description = "A self-hosted control panel for dedicated game servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44.0,<47.0",
    "docker>=7.1,<8.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "ruff>=0.11,<1.0",
    "types-docker>=7.1,<8.0",
]

[project.scripts]
dedodaded = "dedodaded.main:run"

[tool.hatch.build.targets.wheel]
packages = ["dedodaded"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"dedodaded/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dedodaded"]
